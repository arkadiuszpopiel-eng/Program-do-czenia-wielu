[package]
name = "alfa-desktop"
version = "0.0.1"
description = "Alfa — cienka powłoka Tauri 2 (WebView2): okna, zasobnik, skróty globalne, powiadomienia; komendy deleguje do app-core."
edition = "2024"
rust-version = "1.94"
publish = false

# Samodzielny pakiet: NIE należy do workspace Rust w katalogu głównym repo
# (root Cargo.toml wyklucza go wpisem `exclude = ["apps/desktop/src-tauri"]`;
# pusta sekcja [workspace] poniżej sprawia, że cargo nie szuka workspace'u wyżej).
# Moduły (crates/*) dociąga przez `app-core` (ścieżka) — ich wersje zależności z Cargo.lock obok.
[workspace]

[lib]
name = "alfa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Build testowy (Playwright przez CDP): port debugowania WebView2. W produkcji wyłączony (PLAN §8.2).
e2e = []

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
app-core = { path = "../../../crates/app-core" }
# `tray-icon` — zasobnik (§14.8); `protocol-asset` — podgląd obrazów artefaktów przez `asset:`.
tauri = { version = "=2.12.0", features = ["tray-icon", "protocol-asset"] }
# Wtyczki zgodne z tauri ^2.12 (MIT OR Apache-2.0); wersje przypięte (docs/vendor/tauri.md).
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-notification = "=2.5.1"
tauri-plugin-single-instance = "=2.5.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["sync", "time"] }
tracing = "=0.1.44"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
