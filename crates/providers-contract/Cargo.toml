[package]
name = "providers-contract"
description = "Wspólny kontrakt ModelProvider (PLAN §5.1): neutralny IR rozmowy, zdarzenia strumienia, błędy, możliwości, koszt, prywatność, testy kontraktowe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# Współdzielone testy kontraktowe uruchamiane na `providers-fake` i na każdym adapterze z serwerem fixture.
contract-tests = ["dep:tokio", "dep:futures-util"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
schemars.workspace = true
async-trait.workspace = true
futures-core.workspace = true
tokio-util = { version = "0.7.19", default-features = false }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }
tokio = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
futures-util.workspace = true
proptest.workspace = true

[lints]
workspace = true
