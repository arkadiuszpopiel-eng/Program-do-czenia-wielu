# Manifest licznika kosztów (docs/modules/cost-meter/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
id = "cost-meter"
version = "0.0.1"
kind = "service"
provides = ["cost-meter-contract@1"]
requires = ["core-bus-contract@1", "accounts-hub-contract@1"]
capabilities = ["net.egress(api.nbp.pl)"]
lifecycle = "always"
isolation = "inproc"

[budget]
ram_mb = 2
cpu_pct = 1

[health]
check = "ping"
interval_s = 60
