# Manifest modułu `artifacts` (docs/modules/artifacts/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
# Rejestr w bazie sesji; odczyt plików sesji. Akcje (Zapisz jako, Pokaż w Eksploratorze…) wykonuje
# platform-windows jako użytkownik na podstawie intencji.
id = "artifacts"
version = "0.0.1"
kind = "service"
provides = ["artifacts-contract@1"]
requires = ["core-bus-contract@1", "sessions-contract@1"]
capabilities = ["fs.read(%USERPROFILE%/Alfa/Sesje/**)"]
lifecycle = "lazy"
isolation = "inproc"

[budget]
ram_mb = 6
cpu_pct = 5

[health]
check = "ping"
interval_s = 60

[ui]
panel = "artifacts"
