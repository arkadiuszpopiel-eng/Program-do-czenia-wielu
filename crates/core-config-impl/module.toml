# Manifest konfiguracji jądra (docs/modules/core-config/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
id = "core-config"
version = "0.0.1"
kind = "service"
provides = ["core-config-contract@1"]
requires = ["core-bus-contract@1"]
capabilities = ["fs.write(%APPDATA%/Alfa/config/**)"]
lifecycle = "always"
isolation = "inproc"

[budget]
ram_mb = 2
cpu_pct = 1

[health]
check = "ping"
interval_s = 60
