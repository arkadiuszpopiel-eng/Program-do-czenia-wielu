version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
core-config-contract.workspace = true
core-bus-contract.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tracing.workspace = true
# Bez domyślnych funkcji: żadnego pobierania `$ref` przez HTTP ani z plików (bez reqwest/rustls).
jsonschema = { version = "0.58.3", default-features = false }
notify = "8.2.0"

[dev-dependencies]
core-config-contract = { workspace = true, features = ["contract-tests"] }
core-bus-fake = { path = "../core-bus-fake" }
