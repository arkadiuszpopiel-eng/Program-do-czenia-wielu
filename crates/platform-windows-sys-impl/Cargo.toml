[package]
name = "platform-windows-sys-impl"
description = "Sygnały systemowe i obserwacja katalogów dla Windows (windows-rs): bezczynność (GetLastInputInfo), zasilanie (GetSystemPowerStatus + powiadomienia), tryb gry (SHQueryUserNotificationState + okno pełnoekranowe), blokada sesji (WTS), ReadDirectoryChangesW z debounce, przeskanowaniem po przepełnieniu i deny-listą; F6: port systemu dla tools-system (procesy Toolhelp32 z zakończeniem przez uchwyt po sprawdzeniu tożsamości, usługi SCM, Dziennik zdarzeń EvtQuery, zmienne HKCU\\Environment) i kwarantanna pobrań tools-net (bez dowiązań, MOTW)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

# Nowy crate tej samej kategorii co `platform-windows-impl` / `-gui-impl` / `-kernel-impl` (limit 8 000
# linii na crate): implementacja portów `platform-contract`, jedno z miejsc z windows-rs (`deny.toml`:
# `wrappers` dla `windows`). Bez zależności od innych `-impl` (zakaz `-impl` → cudzy `-impl`).
[dependencies]
platform-contract.workspace = true
# F6: `SysPort` (tools-system) i `DownloadStore` (tools-net) z kontraktu portów aplikacji.
platform-apps-contract = { path = "../platform-apps-contract" }

# Ta sama wersja windows-rs co w `platform-windows-impl` (AGENTS.md: jeden crate, jedna wersja).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Spójność bazowej deny-listy obserwacji z deny-listą Jądra (tylko testy).
compliance-contract = { path = "../compliance-contract" }
# Ta sama wersja co w innych crate'ach workspace (Cargo.lock).
tempfile = "3.27.0"

# Kopia [workspace.lints] z jedną różnicą: `unsafe_code = "deny"` zamiast `forbid`, żeby moduły FFI
# mogły mieć `#[allow(unsafe_code)]` (tylko one; każdy blok `unsafe` z komentarzem `// SAFETY:`).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
too_many_lines = "warn"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
undocumented_unsafe_blocks = "deny"
