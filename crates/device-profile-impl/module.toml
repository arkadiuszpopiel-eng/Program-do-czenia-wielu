# Manifest modułu device-profile (docs/modules/device-profile/SPEC.md, PLAN §3.5).
# Schemat: packages/schemas/module-manifest.v1.json
id = "device-profile"
version = "0.0.1"
kind = "service"
provides = ["device-profile-contract@1"]
requires = ["core-bus-contract@1", "platform-contract@1"]
capabilities = []
lifecycle = "always"
isolation = "inproc"

[budget]
ram_mb = 1
cpu_pct = 1

[health]
check = "ping"
interval_s = 60
