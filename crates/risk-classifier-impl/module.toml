# Manifest klasyfikatora ryzyka (docs/modules/risk-classifier/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
# Działa w procesie usługi Brokera (inproc tam), kopia read-only w jądrze do podglądu.
id = "risk-classifier"
version = "0.0.1"
kind = "service"
provides = ["risk-classifier-contract@1"]
requires = ["core-bus-contract@1"]
capabilities = []
lifecycle = "always"
isolation = "inproc"

[budget]
ram_mb = 1
cpu_pct = 1

[health]
check = "ping"
interval_s = 60
