# Manifest rejestru modułów (docs/modules/core-registry/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
id = "core-registry"
version = "0.0.1"
kind = "service"
provides = ["core-registry-contract@1"]
requires = ["core-bus-contract@1"]
capabilities = []
lifecycle = "always"
isolation = "inproc"

[budget]
