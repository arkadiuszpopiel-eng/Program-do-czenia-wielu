# Manifest modułu `memory` (v0 + F7, docs/modules/memory/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
# Brak własnych zdolności: zakres sesji w bazie sesji (SessionDbProvider), projekt/agentka/globalna w osobnych
# szyfrowanych bazach z kluczem w sejfie (KeyVault), indeks i zapytania przez search-contract (TxIndexer/TxSearcher).
id = "memory"
version = "0.0.1"
kind = "service"
provides = ["memory-contract@1"]
requires = ["core-bus-contract@1", "sessions-contract@1", "search-contract@1"]
capabilities = []
lifecycle = "always"
isolation = "inproc"

[budget]
ram_mb = 8
cpu_pct = 5

[health]
check = "ping"
interval_s = 60
