[package]
name = "platform-windows-pty-impl"
description = "Pseudokonsola ConPTY dla wbudowanego terminala (F4, ui-terminal): CreatePseudoConsole, proces w Job Object (zamknięcie zabija drzewo), jawne środowisko, bez logowania strumienia"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

# Wydzielone z `platform-windows-impl` (limit 8 000 linii na crate). Implementacja portu
# `PseudoConsolePort` z `platform-contract`; windows-rs (`deny.toml`: `wrappers` dla `windows`).
[dependencies]
platform-contract.workspace = true

# Ta sama wersja windows-rs co w `platform-windows-impl` (AGENTS.md: jeden crate, jedna wersja).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# Kopia [workspace.lints] z jedną różnicą: `unsafe_code = "deny"` zamiast `forbid`, żeby moduły FFI
# mogły mieć `#[allow(unsafe_code)]` (tylko one; każdy blok `unsafe` z komentarzem `// SAFETY:`).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
too_many_lines = "warn"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
undocumented_unsafe_blocks = "deny"
