[package]
name = "providers-local-impl"
description = "Lokalny ModelProvider: llama.cpp jako sidecar llama-server (127.0.0.1, losowy port i klucz), cykl życia, fallback GPU→CPU, rezydencja, pobieranie GGUF z wznawianiem i SHA-256"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

# Fałszywy `llama-server` dla testów integracyjnych (tylko std + serde_json; bez modelu i GPU).
[[bin]]
name = "fake-llama-server"
path = "src/bin/fake-llama-server.rs"
test = false
doc = false

[dependencies]
providers-contract = { path = "../providers-contract" }
lib-openai-compat = { path = "../lib-openai-compat" }
device-profile-contract = { path = "../device-profile-contract" }
model-residency-contract = { path = "../model-residency-contract" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "process", "io-util", "fs"] }
futures-util.workspace = true
# Te same wersje co w Cargo.lock (providers-api-impl, artifacts-contract, lib-sqlstore).
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "stream", "http2"] }
sha2 = "0.10.9"
getrandom = "0.4.3"

[dev-dependencies]
providers-contract = { path = "../providers-contract", features = ["contract-tests"] }
model-residency-fake = { path = "../model-residency-fake" }
device-profile-fake = { path = "../device-profile-fake" }
core-bus-fake = { path = "../core-bus-fake" }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[lints]
workspace = true
