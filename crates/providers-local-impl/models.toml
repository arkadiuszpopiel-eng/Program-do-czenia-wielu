# Manifest modeli lokalnych (providers-local, ADR 0014, PLAN §1.2).
# Zasady: tylko GGUF, bez kwantów IQ (crashe RDNA3/Vulkan), wyłącznie oficjalne repozytoria autorów
# (speakleash) — Q4_K_M Bielika v3 jest tylko u osób trzecich, więc domyślny jest oficjalny Q8_0.
# `sha256 = ""` oznacza hash jeszcze nieznany w repozytorium: menedżer pobierania liczy go
# przy pierwszym pobraniu, zapisuje obok pliku (`<plik>.sha256`, zaufanie przy pierwszym
# użyciu) i ostrzega w logach; kolejne ładowania sprawdzają rozmiar i zapisany hash.
# Wpisanie hasha tutaj włącza pełną weryfikację łańcucha dostaw (PLAN §8.7).
#
# Pamięć (MB = MiB): `vram_mb`/`ram_mb` BEZ KV cache. `vram_mb` = wagi na GPU (≈ rozmiar pliku;
# przy osadzeniach wspólnych z wyjściem llama.cpp trzyma kopię warstwy wyjściowej na GPU)
# + stały narzut 550 (kontekst CUDA/Vulkan ≈ 300 + bufory obliczeń ≈ 250 przy ubatch 512,
# flash attention „auto” — `GPU_OVERHEAD_MB`). `ram_mb` = wagi + ≈ 750 (proces, bufory) przy
# wykonaniu na CPU. KV cache f16 (`kv_mb_per_1k_ctx`) = warstwy × głowice KV × wymiar głowy × 2 (K, V)
# × 2 B na token, × 1024 / 2²⁰ — doliczany dla kontekstu uruchomienia (`-c`).
schema_version = 1

# Bielik v3 4.5B: Qwen2.5-3B (GQA 16/2, wymiar głowy 128, hidden 2048) pogłębiony do 60 warstw,
# słownik APT4 32 000 (raport techniczny Bielik v3). KV: 60 × 2 × 128 × 2 × 2 B = 61 440 B/token
# → 60 MiB na 1024 tokeny (-c 8192: 480 MB). Wagi Q8_0 = plik 4826 MiB → vram_mb 4826 + 550 ≈ 5400,
# ram_mb 4826 + 750 ≈ 5600. Potwierdzone w próbie generalnej (rehearsal.yml, 2026-10-06, log llama-server
# b6710): n_layer = 60, n_head_kv = 2, n_embd = 2048, n_vocab = 32 000, model params = 4.76 B,
# n_ctx_train = 8192, `llama_kv_cache: size = 480.00 MiB (8192 cells, 60 layers)`; plik 5 061 215 424 B.
[[model]]
id = "bielik-4.5b-v3.0-instruct-q8_0"
name = "Bielik 4.5B v3.0 Instruct (Q8_0)"
url = "https://huggingface.co/speakleash/Bielik-4.5B-v3.0-Instruct-GGUF/resolve/main/Bielik-4.5B-v3.0-Instruct.Q8_0.gguf"
file = "Bielik-4.5B-v3.0-Instruct.Q8_0.gguf"
size_mb = 4826
sha256 = ""
params_b = 4.8
quant = "Q8_0"
layers = 60
# Kontekst treningowy z GGUF (`n_ctx_train`) — dłuższy `-c` pogarsza odpowiedzi.
ctx = 8192
vram_mb = 5400
ram_mb = 5600
kv_mb_per_1k_ctx = 60
tools = true
license = "Apache-2.0"

# Bielik v3 1.5B (lekki — karty ≤ 6 GB obok STT na GPU, słabszy sprzęt): Qwen2.5-1.5B (GQA 12/2,
# wymiar głowy 128, hidden 1536) pogłębiony do 32 warstw. KV: 32 × 2 × 128 × 2 × 2 B = 32 768 B/token
# → 32 MiB na 1024 tokeny (-c 8192: 256 MB). Potwierdzone w próbie generalnej (2026-10-06): n_layer = 32,
# n_head_kv = 2, n_embd = 1536, model params = 1.60 B, n_ctx_train = 8192, `llama_kv_cache: size =
# 256.00 MiB`; plik 1 699 568 288 B. Wagi Q8_0 = plik 1620 MiB → vram_mb 1620 + 550 ≈ 2200, ram_mb ≈ 2400.
# `tools = false`: model 1,5B zbyt zawodnie wywołuje narzędzia (zła ścieżka/argumenty w akcjach
# na plikach) — Router nie wybiera go do zadań agentek; rozmowa i głos działają bez zmian.
[[model]]
id = "bielik-1.5b-v3.0-instruct-q8_0"
name = "Bielik 1.5B v3.0 Instruct (Q8_0)"
url = "https://huggingface.co/speakleash/Bielik-1.5B-v3.0-Instruct-GGUF/resolve/main/Bielik-1.5B-v3.0-Instruct.Q8_0.gguf"
file = "Bielik-1.5B-v3.0-Instruct.Q8_0.gguf"
size_mb = 1620
sha256 = ""
params_b = 1.6
quant = "Q8_0"
layers = 32
# Kontekst treningowy z GGUF (`n_ctx_train`).
ctx = 8192
vram_mb = 2200
ram_mb = 2400
kv_mb_per_1k_ctx = 32
tools = false
license = "Apache-2.0"
