[package]
name = "tools-media-impl"
description = "tools-media: informacje z nagłówków (lib-media), konwersje przez sidecar ffmpeg w Job Object (lista zamknięta, wymuszony demuxer, tylko protokół file, nowy plik przez dziennik cofania) i odtwarzanie przez voice-audio w kolejce mówienia scheduler-lite z duckingiem — wszystko przez Brokera (fs.read, fs.write)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
tools-media-contract = { path = "../tools-media-contract" }
tools-common-contract = { path = "../tools-common-contract" }
safety-broker-contract = { path = "../safety-broker-contract" }
compliance-contract = { path = "../compliance-contract" }
undo-journal-contract = { path = "../undo-journal-contract" }
voice-audio-contract = { path = "../voice-audio-contract" }
scheduler-lite-contract = { path = "../scheduler-lite-contract" }
personas-contract = { path = "../personas-contract" }
lib-media = { path = "../lib-media" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
platform-contract.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tools-media-contract = { path = "../tools-media-contract", features = ["contract-tests"] }
tools-media-fake = { path = "../tools-media-fake" }
lib-media = { path = "../lib-media", features = ["samples"] }
platform-fake = { path = "../platform-fake" }
safety-broker-fake = { path = "../safety-broker-fake" }
voice-audio-fake = { path = "../voice-audio-fake" }
scheduler-lite-fake = { path = "../scheduler-lite-fake" }
core-bus-fake = { path = "../core-bus-fake" }
watchdog-contract = { path = "../watchdog-contract" }
