[package]
name = "agent-backends-fake"
description = "Atrapa AgentBackend w pamięci i fałszywe CLI (claude -p stream-json, codex app-server) do testów mostów bez prawdziwych CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "alfa-fake-agent-cli"
path = "src/bin/alfa-fake-agent-cli/main.rs"
test = false

[dependencies]
agent-backends-contract = { path = "../agent-backends-contract", features = ["contract-tests"] }
async-trait.workspace = true
futures-util.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
agent-backends-impl = { path = "../agent-backends-impl" }
compliance-contract = { path = "../compliance-contract" }
compliance-fake = { path = "../compliance-fake" }
core-bus-contract.workspace = true
core-bus-fake = { path = "../core-bus-fake" }
mcp-fake = { path = "../mcp-fake" }
chrono.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }

[lints]
workspace = true
