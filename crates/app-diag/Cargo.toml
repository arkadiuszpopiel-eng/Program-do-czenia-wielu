[package]
name = "app-diag"
description = "Diagnostyka komputera w aplikacji (kategoria app-*): stan z postępem testów, codzienny automatyczny zapis parametrów, raport Markdown w folderze użytkownika, narzędzie agentek system_diagnostics przez Brokera"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

# `app-*` (crates/README.md, scripts/check-deps.sh): część korzenia kompozycji wydzielona z `app-core`.
[dependencies]
app-api = { path = "../app-api" }
pc-diag-contract = { path = "../pc-diag-contract" }
pc-diag-impl = { path = "../pc-diag-impl" }
platform-windows-diag-impl = { path = "../platform-windows-diag-impl" }
safety-broker-contract = { path = "../safety-broker-contract" }
tools-common-contract = { path = "../tools-common-contract" }
risk-classifier-contract = { path = "../risk-classifier-contract" }
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
pc-diag-fake = { path = "../pc-diag-fake" }
safety-broker-fake = { path = "../safety-broker-fake" }
tools-common-contract = { path = "../tools-common-contract", features = ["contract-tests"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
