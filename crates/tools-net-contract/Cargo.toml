[package]
name = "tools-net-contract"
description = "tools-net: kontrakt narzędzi sieciowych agentek — net_fetch (GET/HEAD tylko https, bez hostów i adresów niepublicznych, każdy host i przekierowanie na inny host przez Brokera net.egress(host), limity rozmiaru i czasu, treść niezaufana), net_download (kwarantanna sesji, SHA-256, MOTW), net_search (port bez dostawcy); porty HttpPort i SearchPort"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# Współdzielone testy kontraktowe (uruchamiane na -impl i -fake).
contract-tests = ["tools-common-contract/contract-tests"]

[dependencies]
tools-common-contract = { path = "../tools-common-contract" }
risk-classifier-contract = { path = "../risk-classifier-contract" }
safety-broker-contract = { path = "../safety-broker-contract" }
# Walidacja adresów (część czysta, bez klienta).
lib-netguard = { path = "../lib-netguard" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true

[lints]
workspace = true
