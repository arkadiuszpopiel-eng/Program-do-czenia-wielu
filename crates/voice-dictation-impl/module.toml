# Manifest modułu voice-dictation (docs/modules/voice-dictation/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
id = "voice-dictation"
version = "0.1.0"
kind = "voice-engine"
provides = ["voice-dictation-contract@1"]
requires = ["core-bus-contract@1", "platform-contract@1", "voice-stt-contract@1", "voice-vad-contract@1", "scheduler-lite-contract@1"]
capabilities = []
lifecycle = "lazy"
isolation = "inproc"

[budget]
# SPEC: lekki (STT liczy voice-stt); wpisanie frazy ≤ 50 ms + 20 ms na porcję 8 znaków (tempo SendInput).
ram_mb = 4
cpu_pct = 1

[health]
check = "ping"
interval_s = 60
