[package]
name = "voice-dictation-impl"
description = "Implementacja voice-dictation: wpisywanie przez InputPort (SendInput Unicode, porcje atomowe) tylko do okna z chwili startu, odmowa dla okien Alfy/Brokera, administratora i pól haseł (UIA), „cofnij to”, runner audio (PTT/przełącznik → VAD → STT)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
voice-dictation-contract = { path = "../voice-dictation-contract" }
platform-contract.workspace = true
voice-audio-contract = { path = "../voice-audio-contract" }
voice-vad-contract = { path = "../voice-vad-contract" }
voice-stt-contract = { path = "../voice-stt-contract" }
voice-wake-contract = { path = "../voice-wake-contract" }
scheduler-lite-contract = { path = "../scheduler-lite-contract" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
async-trait.workspace = true

[dev-dependencies]
voice-dictation-contract = { path = "../voice-dictation-contract", features = ["contract-tests"] }
platform-fake = { path = "../platform-fake" }
voice-audio-fake = { path = "../voice-audio-fake" }
voice-vad-fake = { path = "../voice-vad-fake" }
voice-stt-fake = { path = "../voice-stt-fake" }
scheduler-lite-fake = { path = "../scheduler-lite-fake" }
core-bus-fake = { path = "../core-bus-fake" }
tokio.workspace = true
proptest.workspace = true

