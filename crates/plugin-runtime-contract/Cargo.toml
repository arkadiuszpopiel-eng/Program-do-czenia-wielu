[package]
name = "plugin-runtime-contract"
description = "Wtyczki Wasm (F8-05, ADR 0012): manifest (id, semver, autor, SHA-256 modułu, zdolności ⊆ dozwolone, limity paliwa/czasu/pamięci/I-O), narzędzia z JSON Schema dla rejestru agentek, cykl życia z zatwierdzeniem właściciela z hashem przejrzanej wersji, operacje hosta przez Brokera, zdarzenia plugin.*, zmiana R2 Ulepszacza"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# Współdzielone testy kontraktowe uruchamiane na -impl i -fake.
contract-tests = []

[dependencies]
safety-broker-contract = { path = "../safety-broker-contract" }
tools-common-contract = { path = "../tools-common-contract" }
risk-classifier-contract = { path = "../risk-classifier-contract" }
compliance-contract = { path = "../compliance-contract" }
core-bus-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
semver.workspace = true
thiserror.workspace = true
# Hash modułu Wasm i przejrzanej wersji manifestu (ta sama wersja co w reszcie workspace; MIT OR Apache-2.0).
sha2 = "0.10.9"

[dev-dependencies]
improver-contract = { path = "../improver-contract" }
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
