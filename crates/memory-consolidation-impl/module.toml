# Manifest modułu `memory-consolidation` (Strażniczka pamięci, docs/modules/memory-consolidation/SPEC.md).
# Zadanie tła na żądanie: przebieg nocny (okno, bezczynność), nigdy na baterii ani w trybie gry;
# model lokalny przez providers-contract, budżet tła przez cost-meter-contract.
id = "memory-consolidation"
version = "0.0.1"
kind = "service"
provides = ["memory-consolidation-contract@1"]
requires = ["memory-contract@1", "providers-contract@1", "cost-meter-contract@1", "device-profile-contract@1"]
capabilities = []
lifecycle = "on-demand"
isolation = "inproc"

[budget]
ram_mb = 16
cpu_pct = 10

[health]
check = "ping"
interval_s = 300
