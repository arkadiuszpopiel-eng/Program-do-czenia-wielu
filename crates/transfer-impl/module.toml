# Manifest modułu `transfer` (docs/modules/transfer/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
id = "transfer"
version = "0.0.1"
kind = "service"
provides = ["transfer-contract@1"]
requires = ["core-bus-contract@1", "sessions-contract@1", "accounts-hub-contract@1"]
# Plik paczki: katalog wybrany przez użytkownika w oknie dialogowym (jako Ty). `secrets.read` —
# strażnik eksportu (dokładne wartości do skanu) i eksport sekretów; `secrets.write` — import
# sekretów i klucz snapshotów `Alfa/transfer/snapshot-key`.
capabilities = [
    "fs.read(%LOCALAPPDATA%/Alfa/snapshots/**)",
    "fs.write(%LOCALAPPDATA%/Alfa/snapshots/**)",
    "secrets.read",
    "secrets.write",
]
lifecycle = "on-demand"
isolation = "inproc"

[budget]
ram_mb = 50
cpu_pct = 25

[health]
check = "ping"
interval_s = 300
