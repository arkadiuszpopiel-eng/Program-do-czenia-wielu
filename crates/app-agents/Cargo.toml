[package]
name = "app-agents"
description = "Agentki z narzędziami w aplikacji (kategoria app-*): zestawy tools-fs/shell/clipboard przez Brokera i dziennik cofania, specyfikacja przebiegu agent-runtime z obsady i budżetów, projekcja zdarzeń agent.* na Replay i karty UI, zestaw ewaluacyjny narzędzi F3"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

# `app-*` (crates/README.md, scripts/check-deps.sh): część korzenia kompozycji wydzielona z `app-core`
# (limit 8 000 linii na crate). Składa `tools-*-impl` i `agent-runtime-impl` nad kontraktami
# Brokera, dziennika cofania i platformy; używa jej `app-core` (jedno miejsce kompozycji).
[dependencies]
app-api = { path = "../app-api" }
agent-runtime-contract = { path = "../agent-runtime-contract" }
agent-runtime-impl = { path = "../agent-runtime-impl" }
tools-common-contract = { path = "../tools-common-contract" }
tools-fs-contract = { path = "../tools-fs-contract" }
tools-fs-impl = { path = "../tools-fs-impl" }
tools-shell-contract = { path = "../tools-shell-contract" }
tools-shell-impl = { path = "../tools-shell-impl" }
tools-clipboard-contract = { path = "../tools-clipboard-contract" }
tools-clipboard-impl = { path = "../tools-clipboard-impl" }
# F6: Word/Excel i przeglądarka agentek nad portami `platform-apps` (Windows: COM / CDP przez potok).
tools-office-contract = { path = "../tools-office-contract" }
tools-office-impl = { path = "../tools-office-impl" }
tools-browser-contract = { path = "../tools-browser-contract" }
tools-browser-impl = { path = "../tools-browser-impl" }
platform-apps-contract = { path = "../platform-apps-contract" }
platform-windows-office-impl = { path = "../platform-windows-office-impl" }
# F8: wtyczki Wasm (narzędzia do rejestru agentek, komendy strony „Wtyczki”).
app-plugins = { path = "../app-plugins" }
safety-broker-contract = { path = "../safety-broker-contract" }
risk-classifier-contract = { path = "../risk-classifier-contract" }
undo-journal-contract = { path = "../undo-journal-contract" }
compliance-contract = { path = "../compliance-contract" }
personas-contract = { path = "../personas-contract" }
providers-contract = { path = "../providers-contract" }
watchdog-contract = { path = "../watchdog-contract" }
# v1: zasoby wyłączne (scheduler) dla `RuntimeExt`, umiejętności (koperta `prepare_run`).
scheduler-contract = { path = "../scheduler-contract" }
skills-contract = { path = "../skills-contract" }
core-bus-contract.workspace = true
platform-contract.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
providers-fake = { path = "../providers-fake" }
providers-local-impl = { path = "../providers-local-impl" }
platform-fake = { path = "../platform-fake" }
platform-windows-impl = { path = "../platform-windows-impl" }
safety-broker-fake = { path = "../safety-broker-fake" }
undo-journal-fake = { path = "../undo-journal-fake" }
platform-apps-fake = { path = "../platform-apps-fake" }
tools-office-fake = { path = "../tools-office-fake" }
tools-browser-fake = { path = "../tools-browser-fake" }
plugin-runtime-contract = { path = "../plugin-runtime-contract" }
base64 = "0.22.1"
# Wtyczka testowa z WAT (ta sama linia co w plugin-runtime-impl).
wat = "=1.236.1"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
