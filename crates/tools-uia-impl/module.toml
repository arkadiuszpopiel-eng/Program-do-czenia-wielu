# Manifest narzędzi tools-uia (docs/modules/tools-uia/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
# Zdolność z tokenu Brokera per wywołanie: `gui.control(<aplikacja okna>)`; pulpit: `gui.control(desktop.exe)`.
id = "tools-uia"
version = "0.0.1"
kind = "tool"
provides = ["tools-uia-contract@1"]
requires = ["tools-common-contract@1", "tools-window-contract@1", "safety-broker-contract@1", "platform-contract@1", "core-bus-contract@1"]
capabilities = ["gui.control(aplikacja-okna)"]
lifecycle = "lazy"
isolation = "inproc"

[budget]
ram_mb = 4
cpu_pct = 2

[health]
check = "ping"
interval_s = 60
