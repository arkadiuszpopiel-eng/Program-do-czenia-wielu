[package]
name = "app-mcp"
description = "Serwery MCP podłączane przez użytkownika (kategoria app-*): lista w konfiguracji bez sekretów (zmienne tajne w Menedżerze poświadczeń), uruchamianie na żądanie przez stdio, zgody na narzędzia powiązane z odciskiem opisu, narzędzia agentek mcp_tools / mcp_call przez Brokera"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

# `app-*` (crates/README.md, scripts/check-deps.sh): część korzenia kompozycji wydzielona z `app-core`.
[dependencies]
app-api = { path = "../app-api" }
mcp-contract = { path = "../mcp-contract" }
mcp-impl = { path = "../mcp-impl" }
accounts-hub-contract = { path = "../accounts-hub-contract" }
safety-broker-contract = { path = "../safety-broker-contract" }
tools-common-contract = { path = "../tools-common-contract" }
risk-classifier-contract = { path = "../risk-classifier-contract" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
mcp-fake = { path = "../mcp-fake" }
accounts-hub-fake = { path = "../accounts-hub-fake" }
tools-common-contract = { path = "../tools-common-contract", features = ["contract-tests"] }
safety-broker-fake = { path = "../safety-broker-fake" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
