[package]
name = "app-plugins"
description = "Wtyczki Wasm w aplikacji (kategoria app-*, F8-05): plugin-runtime-impl nad Brokerem, magazynem w katalogu danych Alfy i hostem operacji (pliki przez dziennik cofania, sieć przez klienta z egress-allowlistą — oba z własnym Broker::verify), narzędzia do rejestru agentek, komendy plugins_* i problemy dla Diagnosty"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

# `app-*` (crates/README.md, scripts/check-deps.sh): część korzenia kompozycji — składa
# `plugin-runtime-impl` nad kontraktami Brokera, dziennika cofania i platformy; używa jej
# `app-agents` (rejestr narzędzi agentek) i `app-core` (komendy).
[dependencies]
app-api = { path = "../app-api" }
plugin-runtime-contract = { path = "../plugin-runtime-contract" }
plugin-runtime-impl = { path = "../plugin-runtime-impl" }
safety-broker-contract = { path = "../safety-broker-contract" }
tools-common-contract = { path = "../tools-common-contract" }
compliance-contract = { path = "../compliance-contract" }
undo-journal-contract = { path = "../undo-journal-contract" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
platform-contract.workspace = true
async-trait.workspace = true
base64 = "0.22.1"
chrono.workspace = true
semver.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Klient sieci wtyczek: rustls + ring, bez proxy systemowego (docs/vendor/reqwest.md); wersja jak
# w app-core / providers-api-impl.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }

[dev-dependencies]
safety-broker-fake = { path = "../safety-broker-fake" }
undo-journal-fake = { path = "../undo-journal-fake" }
undo-journal-contract = { path = "../undo-journal-contract" }
platform-fake = { path = "../platform-fake" }
core-bus-fake = { path = "../core-bus-fake" }
risk-classifier-contract = { path = "../risk-classifier-contract" }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
# Wtyczki testowe kompilowane z WAT (ta sama linia co w plugin-runtime-impl).
wat = "=1.236.1"

[lints]
workspace = true
