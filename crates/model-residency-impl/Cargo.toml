[package]
name = "model-residency-impl"
description = "Zarządca rezydencji modeli (RAM/VRAM): dzierżawy, wymiana LRU z priorytetami, tryb gry/baterii z device-profile, zdarzenia residency.* na magistralę"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
model-residency-contract = { path = "../model-residency-contract" }
device-profile-contract = { path = "../device-profile-contract" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
model-residency-contract = { path = "../model-residency-contract", features = ["contract-tests"] }
device-profile-fake = { path = "../device-profile-fake" }
core-bus-fake = { path = "../core-bus-fake" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true
