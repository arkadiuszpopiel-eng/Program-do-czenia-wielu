[package]
name = "tools-office-contract"
description = "tools-office: kontrakt narzędzi Word/Excel dla agentek — odczyt tekstu, tabel i zakresów (treść niezaufana), edycja kopii roboczej z zapisem nowej wersji przez dziennik cofania (oryginał nietknięty), makra zawsze wyłączone, formuły z listy dozwolonej"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# Współdzielone testy kontraktowe (uruchamiane na -impl i -fake).
contract-tests = ["tools-common-contract/contract-tests"]

[dependencies]
tools-common-contract = { path = "../tools-common-contract" }
risk-classifier-contract = { path = "../risk-classifier-contract" }
safety-broker-contract = { path = "../safety-broker-contract" }
platform-apps-contract = { path = "../platform-apps-contract" }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

[lints]
workspace = true
