# Manifest Kreatora agentów (docs/modules/agent-builder/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
# Kreator nie żąda zdolności; zapis persony i roli idzie przez usługę personas (po zatwierdzeniu właściciela).
id = "agent-builder"
version = "0.0.1"
kind = "service"
provides = ["agent-builder-contract@1"]
requires = ["core-bus-contract@1", "personas-contract@1", "tools-common-contract@1"]
capabilities = []
lifecycle = "on-demand"
isolation = "inproc"

[budget]
ram_mb = 2
cpu_pct = 1

[health]
check = "ping"
interval_s = 60
