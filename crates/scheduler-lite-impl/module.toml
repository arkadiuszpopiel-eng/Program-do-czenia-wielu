# Manifest schedulera zasobów wyłącznych (docs/modules/scheduler-lite/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
id = "scheduler-lite"
version = "0.0.1"
kind = "service"
provides = ["scheduler-lite-contract@1"]
requires = ["core-bus-contract@1", "personas-contract@1"]
capabilities = []
lifecycle = "always"
isolation = "inproc"

[budget]
ram_mb = 1
cpu_pct = 1

[health]
check = "ping"
interval_s = 30
