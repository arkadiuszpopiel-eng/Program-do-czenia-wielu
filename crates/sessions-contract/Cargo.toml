[package]
name = "sessions-contract"
description = "Sesje: kontrakt — katalog sesji, historia append-only jako drzewo gałęzi, sejf kluczy, dostęp do bazy sesji"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# Współdzielone testy kontraktowe (+ strategia proptest) uruchamiane przeciw `-impl` i `-fake`.
contract-tests = ["dep:proptest"]

[dependencies]
core-bus-contract.workspace = true
lib-sqlstore = { path = "../lib-sqlstore" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
schemars.workspace = true
chrono.workspace = true
proptest = { workspace = true, optional = true }

[lints]
workspace = true
