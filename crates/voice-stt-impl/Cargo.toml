[package]
name = "voice-stt-impl"
description = "Implementacja voice-stt: sidecar whisper-server (whisper.cpp) na 127.0.0.1, Vulkan/CUDA/CPU z fallbackiem, bramka VAD, dwa przebiegi, dzierżawa model-residency"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
voice-stt-contract = { path = "../voice-stt-contract" }
voice-audio-contract = { path = "../voice-audio-contract" }
device-profile-contract = { path = "../device-profile-contract" }
model-residency-contract = { path = "../model-residency-contract" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
# Wiersze stderr `whisper-server` (błędy, backend) w dzienniku diagnostycznym Alfy (`app-logs`).
tracing.workspace = true
# Klient HTTP tylko do 127.0.0.1: bez TLS, bez proxy, z multipart (docs/vendor/reqwest.md: 0.12.28).
reqwest = { version = "0.12.28", default-features = false, features = ["multipart"] }

[dev-dependencies]
voice-stt-contract = { path = "../voice-stt-contract", features = ["contract-tests"] }
model-residency-fake = { path = "../model-residency-fake" }
core-bus-fake = { path = "../core-bus-fake" }
tokio = { workspace = true, features = ["net", "io-util", "process"] }

[lints]
workspace = true
