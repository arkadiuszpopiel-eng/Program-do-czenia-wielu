# Manifest modułu voice-stt (docs/modules/voice-stt/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
id = "voice-stt"
version = "0.0.1"
kind = "voice-engine"
provides = ["voice-stt-contract@1"]
requires = ["core-bus-contract@1", "voice-vad-contract@1", "model-residency-contract@1", "device-profile-contract@1"]
# Lokalny sidecar: brak zdolności sieciowych (127.0.0.1); chmura (kolejna fala) — net.egress(host) per konto.
capabilities = []
lifecycle = "on-demand"
isolation = "process"

[budget]
# SPEC: RAM sidecara ≤ 1,5 GB (tu: sam moduł w procesie jądra), VRAM 1–2,5 GB (turbo Q5_0).
ram_mb = 64
cpu_pct = 5
vram_mb = 2500

[health]
check = "ping"
interval_s = 30
