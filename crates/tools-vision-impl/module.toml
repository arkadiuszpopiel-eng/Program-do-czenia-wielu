# Manifest narzędzi tools-vision (docs/modules/tools-vision/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
# Zdolności z tokenu Brokera per wywołanie: zrzut — `gui.control(<aplikacja okna>)` albo `gui.control(desktop.exe)`;
# plik — `fs.read(plik)`. Opis obrazu idzie przez Router (klasa GUI/wizja) z tagiem prywatności sesji.
id = "tools-vision"
version = "0.0.1"
kind = "tool"
provides = ["tools-vision-contract@1"]
requires = ["tools-common-contract@1", "tools-screen-contract@1", "tools-window-contract@1", "safety-broker-contract@1", "platform-contract@1", "providers-contract@1", "core-bus-contract@1"]
capabilities = ["gui.control(aplikacja-okna)", "fs.read(plik-obrazu)"]
lifecycle = "lazy"
isolation = "inproc"

[budget]
ram_mb = 64
cpu_pct = 10

[health]
check = "ping"
interval_s = 60
