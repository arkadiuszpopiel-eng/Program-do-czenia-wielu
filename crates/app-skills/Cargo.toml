[package]
name = "app-skills"
description = "Umiejętności i Kreator agentów w aplikacji (kategoria app-*): skills-impl (biblioteka, propozycje z diffem i hashem, kwarantanna, instalacja tylko z UI, uruchomienie jako zadanie agentki z kopertą ≤ roli, eksport/import) i agent-builder-impl (szkic z rozmowy/formularza, podgląd persony, test na sucho, zapis nie-głosem, sufit autonomii z Brokera)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

# `app-*` (crates/README.md, scripts/check-deps.sh): część korzenia kompozycji wydzielona z `app-core`
# (limit 8 000 linii na crate). Składa `skills-impl` i `agent-builder-impl`; używa jej `app-core`.
[dependencies]
app-api = { path = "../app-api" }
app-agents = { path = "../app-agents" }
app-tasks = { path = "../app-tasks" }
skills-contract = { path = "../skills-contract" }
skills-impl = { path = "../skills-impl" }
agent-builder-contract = { path = "../agent-builder-contract" }
agent-builder-impl = { path = "../agent-builder-impl" }
personas-contract = { path = "../personas-contract" }
tools-common-contract = { path = "../tools-common-contract" }
safety-broker-contract = { path = "../safety-broker-contract" }
risk-classifier-contract = { path = "../risk-classifier-contract" }
voice-tts-contract = { path = "../voice-tts-contract" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
chrono.workspace = true
futures-util.workspace = true
semver.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
