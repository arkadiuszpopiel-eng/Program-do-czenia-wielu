[package]
name = "router-impl"
description = "Router: klasy zadań × ograniczenia (zgodność, prywatność, budżet, możliwości, opóźnienie), fallback ≤ 2 s bez utraty wiadomości, circuit breaker, okna 429; Router jako ModelProvider"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
router-contract = { path = "../router-contract" }
providers-contract = { path = "../providers-contract" }
compliance-contract = { path = "../compliance-contract" }
cost-meter-contract = { path = "../cost-meter-contract" }
accounts-hub-contract = { path = "../accounts-hub-contract" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt"] }
tokio-stream.workspace = true
futures-util.workspace = true

[dev-dependencies]
router-contract = { path = "../router-contract", features = ["contract-tests"] }
providers-fake = { path = "../providers-fake" }
compliance-fake = { path = "../compliance-fake" }
cost-meter-fake = { path = "../cost-meter-fake" }
core-bus-fake = { path = "../core-bus-fake" }
chrono.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true
