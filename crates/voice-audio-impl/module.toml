# Manifest modułu voice-audio (docs/modules/voice-audio/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
id = "voice-audio"
version = "0.0.1"
kind = "voice-engine"
provides = ["voice-audio-contract@1"]
requires = ["core-bus-contract@1"]
capabilities = []
lifecycle = "lazy"
isolation = "inproc"

[budget]
# SPEC: RAM ≤ 10 MB (kolejka toru głosu 30 s mono f32 @ 48 kHz ≈ 5,8 MB + efekty + referencja AEC),
# CPU ≤ 2% rdzenia przy otwartym wejściu i wyjściu.
ram_mb = 10
cpu_pct = 2

[health]
check = "ping"
interval_s = 60
