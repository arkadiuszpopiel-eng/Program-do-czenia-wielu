# Manifest log-writera jądra (docs/modules/core-log/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
id = "core-log"
version = "0.0.1"
kind = "service"
provides = ["core-log-contract@1"]
requires = ["core-bus-contract@1"]
capabilities = ["fs.write(%LOCALAPPDATA%/Alfa/logs/**)"]
lifecycle = "always"
isolation = "inproc"

[budget]
ram_mb = 8
cpu_pct = 2

[health]
check = "ping"
interval_s = 60
