# Manifest modułu MCP (docs/modules/mcp/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
id = "mcp"
version = "0.0.1"
kind = "service"
provides = ["mcp-contract@1"]
requires = ["core-bus-contract@1", "platform-contract@1"]
capabilities = ["clipboard.read", "clipboard.write", "windows.list", "windows.focus"]
lifecycle = "on-demand"
isolation = "inproc"

[budget]
ram_mb = 4
cpu_pct = 1

[health]
check = "ping"
interval_s = 60
