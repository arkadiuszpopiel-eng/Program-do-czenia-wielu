[package]
name = "artifacts-contract"
description = "Artefakty: kontrakt — rejestr plików wyjściowych sesji (wersje, SHA-256, mime), podgląd tekstowy, diff, intencje akcji UI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# Współdzielone testy kontraktowe uruchamiane przeciw `-impl` i `-fake`.
contract-tests = ["dep:tempfile"]

[dependencies]
core-bus-contract.workspace = true
sessions-contract = { path = "../sessions-contract" }
serde.workspace = true
thiserror.workspace = true
schemars.workspace = true
chrono.workspace = true
# Diff tekstowy między wersjami (wspólny dla `-impl` i `-fake`).
similar = "3.2.0"
# SHA-256 treści wersji.
sha2 = "0.10.9"
tempfile = { version = "3.27.0", optional = true }

[dev-dependencies]
serde_json.workspace = true
proptest.workspace = true

[lints]
workspace = true
