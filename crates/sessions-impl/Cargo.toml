[package]
name = "sessions-impl"
description = "Sesje: implementacja — osobna szyfrowana baza SQLCipher per sesja, katalog index.db, historia append-only (wyzwalacze), crypto-shredding"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# `FileKeyVault`: klucze jawnie w plikach — WYŁĄCZNIE testy/dev, niebezpieczne w produkcji.
dev-file-vault = []

[dependencies]
sessions-contract = { path = "../sessions-contract" }
search-contract = { path = "../search-contract" }
lib-sqlstore = { path = "../lib-sqlstore" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# UUIDv7 (sortowalne w czasie, jak ULID) — ta sama wersja crate'a co w workspace, dodatkowy feature.
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
sessions-contract = { path = "../sessions-contract", features = ["contract-tests"] }
sessions-fake = { path = "../sessions-fake" }
search-fake = { path = "../search-fake" }
core-bus-fake = { path = "../core-bus-fake" }
proptest.workspace = true
tempfile = "3.27.0"

[lints]
workspace = true
