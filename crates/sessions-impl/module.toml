# Manifest modułu `sessions` (docs/modules/sessions/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
id = "sessions"
version = "0.0.1"
kind = "service"
provides = ["sessions-contract@1"]
requires = ["core-bus-contract@1", "search-contract@1"]
capabilities = [
    "fs.read(%LOCALAPPDATA%/Alfa/sessions/**)",
    "fs.write(%LOCALAPPDATA%/Alfa/sessions/**)",
    "secrets.credential_manager(alfa/sessions/*)",
]
lifecycle = "always"
isolation = "inproc"

[budget]
ram_mb = 10
cpu_pct = 5

[health]
check = "ping"
interval_s = 60
