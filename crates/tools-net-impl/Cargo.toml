[package]
name = "tools-net-impl"
description = "tools-net: sieć agentek bez przeglądarki — net_fetch/net_download/net_search przez Brokera net.egress(host) przy każdym hoście i przekierowaniu na inny host, klient HTTPS z lib-netguard (bez proxy i przekierowań, resolver odrzucający adresy niepubliczne — DNS rebinding), limity rozmiaru i czasu, pobieranie strumieniowe do kwarantanny sesji (fs.write) z SHA-256 i MOTW, treść niezaufana"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
tools-net-contract = { path = "../tools-net-contract" }
tools-common-contract = { path = "../tools-common-contract" }
safety-broker-contract = { path = "../safety-broker-contract" }
risk-classifier-contract = { path = "../risk-classifier-contract" }
compliance-contract = { path = "../compliance-contract" }
platform-apps-contract = { path = "../platform-apps-contract" }
lib-netguard = { path = "../lib-netguard", features = ["client"] }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
sha2 = "0.10.9"
# Ten sam klient co lib-netguard (wersja i cechy jak w app-plugins).
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tools-net-contract = { path = "../tools-net-contract", features = ["contract-tests"] }
tools-net-fake = { path = "../tools-net-fake" }
platform-apps-fake = { path = "../platform-apps-fake" }
safety-broker-fake = { path = "../safety-broker-fake" }
core-bus-fake = { path = "../core-bus-fake" }
watchdog-contract = { path = "../watchdog-contract" }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
