# Manifest narzędzi tools-engine (docs/modules/tools-engine/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
# Zdolności z tokenu Brokera: `fs.read(katalog silnika)` — stan i dokumentacja, `shell.exec(katalog silnika)` —
# uruchomienie serwera i podgląd, `gui.control(engine-server)` — wywołania JSON-RPC serwera.
id = "tools-engine"
version = "0.0.76"
kind = "tool"
provides = ["tools-engine-contract@1"]
requires = ["tools-common-contract@1", "platform-contract@1", "safety-broker-contract@1"]
capabilities = ["fs.read(path)", "shell.exec(path)", "gui.control(engine-server.exe)"]
lifecycle = "lazy"
isolation = "inproc"

[budget]
ram_mb = 16
cpu_pct = 5

[health]
check = "ping"
interval_s = 60
