[package]
name = "lib-markdown"
description = "Wspólna biblioteka (bez logiki modułu): Markdown z LLM → bezpieczny HTML w Rust (pulldown-cmark + ammonia), renderowanie przyrostowe strumienia, tekst mówiony (ADR 0009)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# Parser CommonMark + GFM (tabele, listy zadań, przekreślenia). Bez domyślnego `html` — HTML pisze nasz writer.
pulldown-cmark = { version = "0.13.4", default-features = false }
# Sanitizacja HTML z białą listą (ADR 0009, THREAT_MODEL S12).
ammonia = "4.2.0"
serde.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
