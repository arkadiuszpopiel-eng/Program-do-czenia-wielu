[package]
name = "tools-office-impl"
description = "tools-office: odczyt i edycja Word/Excel przez Brokera (fs.read, fs.write, gui.control) i OfficePort — kopia robocza zapisywana jako nowa wersja przez dziennik cofania, makra wyłączone (fail-closed), treść niezaufana"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
tools-office-contract = { path = "../tools-office-contract" }
tools-common-contract = { path = "../tools-common-contract" }
safety-broker-contract = { path = "../safety-broker-contract" }
risk-classifier-contract = { path = "../risk-classifier-contract" }
compliance-contract = { path = "../compliance-contract" }
undo-journal-contract = { path = "../undo-journal-contract" }
platform-apps-contract = { path = "../platform-apps-contract" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
platform-contract.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tools-office-contract = { path = "../tools-office-contract", features = ["contract-tests"] }
platform-apps-fake = { path = "../platform-apps-fake" }
platform-fake = { path = "../platform-fake" }
safety-broker-fake = { path = "../safety-broker-fake" }
core-bus-fake = { path = "../core-bus-fake" }
watchdog-contract = { path = "../watchdog-contract" }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
