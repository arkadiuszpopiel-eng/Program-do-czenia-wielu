# Manifest narzędzi tools-office (docs/modules/tools-office/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
# Zdolności z tokenów Brokera per wywołanie: `fs.read(oryginał)`, `fs.write(nowa wersja)`, `gui.control(winword.exe|excel.exe)`.
id = "tools-office"
version = "0.0.1"
kind = "tool"
provides = ["tools-office-contract@1"]
requires = ["tools-common-contract@1", "platform-apps-contract@1", "undo-journal-contract@1", "safety-broker-contract@1", "platform-contract@1", "core-bus-contract@1"]
capabilities = ["fs.read(dokument)", "fs.write(nowa-wersja)", "gui.control(winword.exe)", "gui.control(excel.exe)"]
lifecycle = "lazy"
isolation = "inproc"

[budget]
ram_mb = 8
cpu_pct = 5

[health]
check = "ping"
interval_s = 60
