# Manifest modułu `search` (docs/modules/search/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
# Brak własnych zdolności: działa na bazach sesji otwartych przez `sessions` (SessionDbProvider).
id = "search"
version = "0.0.1"
kind = "service"
provides = ["search-contract@1"]
requires = ["core-bus-contract@1", "sessions-contract@1"]
capabilities = []
lifecycle = "lazy"
isolation = "inproc"

[budget]
ram_mb = 8
cpu_pct = 10

[health]
check = "ping"
interval_s = 60
