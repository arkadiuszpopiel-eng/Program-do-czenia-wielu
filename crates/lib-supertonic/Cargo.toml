[package]
name = "lib-supertonic"
description = "Sidecar mowy Supertonic 3 (ONNX Runtime na procesorze, osobny proces): protokół JSON-lines po stdio zgodny z voice-tts-impl; przygotowanie tekstu, barwy głosu, odszumianie w krokach"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "alfa-supertonic"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22.1"
unicode-normalization = "0.1.25"
# ONNX Runtime ładowany dynamicznie z pliku obok sidecara (bez pobierania binariów przy budowie).
# ADR 0004: ONNX Runtime wolno uruchamiać w osobnym procesie, nie w procesie Alfy.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
