[package]
name = "tools-shell-impl"
description = "tools-shell: polecenia powłoki przez Brokera (shell.exec z regułami Jądra, net.egress dla poleceń sieciowych), snapshot zakresu w dzienniku cofania, Job Object przez ExecPort, środowisko bez sekretów, rejestr kill-switcha"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
tools-shell-contract = { path = "../tools-shell-contract" }
tools-common-contract = { path = "../tools-common-contract" }
