# Manifest modułu voice-readaloud (docs/modules/voice-readaloud/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
id = "voice-readaloud"
version = "0.1.0"
kind = "voice-engine"
provides = ["voice-readaloud-contract@1"]
requires = ["core-bus-contract@1", "platform-contract@1", "voice-tts-contract@1", "voice-audio-contract@1", "scheduler-lite-contract@1"]
capabilities = []
lifecycle = "lazy"
isolation = "inproc"

[budget]
# SPEC: lekki — syntezę liczy voice-tts; odczyt UIA ≤ 5 s (limit portu), tekst ≤ 50 000 znaków w pamięci.
ram_mb = 4
cpu_pct = 1

[health]
check = "ping"
interval_s = 60
