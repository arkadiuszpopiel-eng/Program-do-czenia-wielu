[package]
name = "voice-readaloud-impl"
description = "Implementacja voice-readaloud: tekst z UIA TextPattern (dokument, zaznaczenie przez SelectionReader, zapas Ctrl+C z przywróceniem schowka), odmowa dla pól haseł i okien Alfy/Brokera, synteza głosem agentki (lokalnie), głośnik jako zasób scheduler-lite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
voice-readaloud-contract = { path = "../voice-readaloud-contract" }
platform-contract.workspace = true
personas-contract = { path = "../personas-contract" }
voice-tts-contract = { path = "../voice-tts-contract" }
voice-audio-contract = { path = "../voice-audio-contract" }
voice-wake-contract = { path = "../voice-wake-contract" }
scheduler-lite-contract = { path = "../scheduler-lite-contract" }
providers-contract = { path = "../providers-contract" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
async-trait.workspace = true
tokio.workspace = true

[dev-dependencies]
voice-readaloud-contract = { path = "../voice-readaloud-contract", features = ["contract-tests"] }
platform-fake = { path = "../platform-fake" }
voice-tts-fake = { path = "../voice-tts-fake" }
voice-audio-fake = { path = "../voice-audio-fake" }
scheduler-lite-fake = { path = "../scheduler-lite-fake" }

[lints]
workspace = true
