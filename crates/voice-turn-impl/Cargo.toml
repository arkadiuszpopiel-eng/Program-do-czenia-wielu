lib-sidecar-guard = { path = "../lib-sidecar-guard" }
voice-turn-contract = { path = "../voice-turn-contract" }
serde_json.workspace = true
base64 = "0.22.1"

[dev-dependencies]
voice-turn-contract = { path = "../voice-turn-contract", features = ["contract-tests"] }
voice-turn-fake = { path = "../voice-turn-fake" }
core-registry-contract.workspace = true
proptest.workspace = true

[lints]
workspace = true
