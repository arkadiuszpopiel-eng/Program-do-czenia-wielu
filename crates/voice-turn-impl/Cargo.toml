[package]
name = "voice-turn-impl"
description = "voice-turn: polityka cierpliwości końca tury (VAD + model + hezytacje PL), heurystyczny model tekstowy i klient procesu Smart Turn"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
