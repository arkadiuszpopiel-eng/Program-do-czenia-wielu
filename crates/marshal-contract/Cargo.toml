[package]
name = "marshal-contract"
description = "Marszałek (F5): kontrakt — deklaratywne reguły, które tylko zawężają (sprawdzanie względem sufitu, konflikty, polityka efektywna), propozycje zatwierdzane wyłącznie przez użytkownika, nadzór zadań (blokady, budżety, pętle, eskalacje) i raport dzienny"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# Współdzielone testy kontraktowe uruchamiane na `-impl` i `-fake`.
contract-tests = []

[dependencies]
scheduler-contract = { path = "../scheduler-contract" }
safety-broker-contract = { path = "../safety-broker-contract" }
triggers-contract = { path = "../triggers-contract" }
personas-contract = { path = "../personas-contract" }
core-bus-contract.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
schemars.workspace = true

[lints]
workspace = true
