# Manifest modułu voice-vad (docs/modules/voice-vad/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
id = "voice-vad"
version = "0.0.1"
kind = "voice-engine"
provides = ["voice-vad-contract@1"]
requires = ["core-bus-contract@1", "voice-dsp-contract@1", "model-residency-contract@1"]
capabilities = []
lifecycle = "lazy"
isolation = "inproc"

[budget]
# SPEC: CPU ≤ 2% rdzenia baseline, RAM ≤ 30 MB (model ≈ 2 MB + tract), opóźnienie ≤ 60 ms.
ram_mb = 30
cpu_pct = 2

[health]
check = "ping"
interval_s = 60
