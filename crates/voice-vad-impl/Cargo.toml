[package]
name = "voice-vad-impl"
description = "Implementacja voice-vad: Silero VAD (ONNX) przez tract-onnx (czysty Rust), detektor energii jako zapas, dzierżawa model-residency"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
voice-vad-contract = { path = "../voice-vad-contract" }
voice-audio-contract = { path = "../voice-audio-contract" }
model-residency-contract = { path = "../model-residency-contract" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
async-trait.workspace = true
serde_json.workspace = true
# Inferencja ONNX w czystym Rust (MIT OR Apache-2.0); ADR 0004: „ONNX Runtime CPU” → tract (bez binariów).
tract-onnx = "0.23.8"
sha2 = "0.10.9"

[dev-dependencies]
voice-vad-contract = { path = "../voice-vad-contract", features = ["contract-tests"] }
model-residency-fake = { path = "../model-residency-fake" }
core-bus-fake = { path = "../core-bus-fake" }
tokio.workspace = true

[lints]
workspace = true
