[package]
name = "platform-windows-impl"
description = "Implementacja SystemPort i HardwarePort dla Windows (windows-rs): pliki z Koszem i dziennikiem cofnięć, procesy w Job Object, schowek, okna, skróty globalne + hook PTT, adapter zasobnika"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
platform-contract.workspace = true
serde.workspace = true

# Jedyny crate z windows-rs w workspace (AGENTS.md: jeden crate, jedna wersja; docs/vendor/windows.md).
# Wersja przypięta w Cargo.lock; do przeniesienia do [workspace.dependencies] przy najbliższym ADR.
# `windows-core` (ta sama rodzina i wersja 0.62, już w Cargo.lock) jest potrzebny wprost, bo makro
# `#[implement]` (sink `IFileOperationProgressSink`) generuje ścieżki `::windows_core::…`.
[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_DXCore",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
core-registry-contract.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"

# Kopia [workspace.lints] z jedną różnicą: `unsafe_code = "deny"` zamiast `forbid`, żeby moduły FFI
# mogły mieć `#[allow(unsafe_code)]` (tylko one; każdy blok `unsafe` z komentarzem `// SAFETY:`).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
too_many_lines = "warn"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
undocumented_unsafe_blocks = "deny"
