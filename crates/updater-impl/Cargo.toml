[package]
name = "updater-impl"
description = "Launcher i aktualizacje: implementacja na systemie plików (versions/<ver>, current.json zapisywany atomowo, webview-data), crash-loop i rollback, sprzątanie, weryfikacja minisign; binarium `alfa` = stały launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

# Stały launcher `%LOCALAPPDATA%\Alfa\alfa.exe` (ADR 0007). Osobny pakiet nie mógłby zależeć od
# `updater-impl` (scripts/check-deps.sh), więc binarium jest częścią modułu.
[[bin]]
name = "alfa"
path = "src/bin/alfa.rs"
test = false
doc = false

[dependencies]
updater-contract = { path = "../updater-contract" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
semver.workspace = true
# Skrót paczki wydania (ta sama wersja co w workspace; MIT OR Apache-2.0).
sha2 = "0.10.9"
# Weryfikacja podpisów minisign, bez zależności zewnętrznych (MIT).
minisign-verify = "0.3.0"

[dev-dependencies]
updater-contract = { path = "../updater-contract", features = ["contract-tests"] }
core-bus-fake = { path = "../core-bus-fake" }
# Generowanie par kluczy i podpisów w testach (MIT).
minisign = "0.10.0"
tempfile = "3.27.0"
proptest.workspace = true

[lints]
workspace = true
