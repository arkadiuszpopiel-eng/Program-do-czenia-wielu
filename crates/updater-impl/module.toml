# Manifest modułu `updater` (docs/modules/updater/SPEC.md, ADR 0007). Schemat: packages/schemas/module-manifest.v1.json
# Moduł Jądra: zmiany wymagają przeglądu człowieka (AGENTS.md). Launcher `alfa.exe` to binarium tego pakietu.
id = "updater"
version = "0.0.1"
kind = "service"
provides = ["updater-contract@1"]
requires = ["core-bus-contract@1"]
capabilities = [
    "fs.read(%LOCALAPPDATA%/Alfa/**)",
    "fs.write(%LOCALAPPDATA%/Alfa/versions/**)",
    "fs.write(%LOCALAPPDATA%/Alfa/current.json)",
    "process.spawn(%LOCALAPPDATA%/Alfa/versions/*/alfa-desktop.exe)",
]
lifecycle = "on-demand"
isolation = "inproc"

[budget]
ram_mb = 3
cpu_pct = 1

[health]
check = "ping"
interval_s = 300
