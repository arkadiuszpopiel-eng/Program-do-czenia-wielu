[package]
name = "agent-builder-contract"
description = "Kreator agentów (F5, PLAN §9.5): szkic z rozmowy albo formularza → walidowany manifest (persona z odmianą imienia, rola, kolor, głos v0, prompt w rodzaju żeńskim, narzędzia ⊆ dozwolone, limity), podgląd, test na sucho, zapis po zatwierdzeniu; bez uprawnień Jądra i bez podnoszenia autonomii"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# Współdzielone testy kontraktowe (w tym ≥ 30 prób ataku) uruchamiane na -impl i -fake.
contract-tests = []

[dependencies]
personas-contract = { path = "../personas-contract" }
agent-runtime-contract = { path = "../agent-runtime-contract" }
tools-common-contract = { path = "../tools-common-contract" }
voice-tts-contract = { path = "../voice-tts-contract" }
risk-classifier-contract = { path = "../risk-classifier-contract" }
core-bus-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
# Hash manifestu do zatwierdzenia (ta sama wersja co w reszcie workspace; MIT OR Apache-2.0).
sha2 = "0.10.9"

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
