# Manifest narzędzi tools-browser (docs/modules/tools-browser/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
# Zdolność z tokenu Brokera: `net.egress(host)` — przy otwarciu (host + extra_hosts) i przy każdej akcji na stronie.
id = "tools-browser"
version = "0.0.1"
kind = "tool"
provides = ["tools-browser-contract@1"]
requires = ["tools-common-contract@1", "platform-apps-contract@1", "safety-broker-contract@1", "core-bus-contract@1"]
capabilities = ["net.egress(host)"]
lifecycle = "lazy"
isolation = "inproc"

[budget]
ram_mb = 16
cpu_pct = 5

[health]
check = "ping"
interval_s = 60
