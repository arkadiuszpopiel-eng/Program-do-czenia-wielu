serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
improver-contract = { path = "../improver-contract", features = ["contract-tests"] }
evals-contract = { path = "../evals-contract", features = ["contract-tests"] }
evals-fake = { path = "../evals-fake" }
core-config-fake = { path = "../core-config-fake" }
core-bus-fake = { path = "../core-bus-fake" }
tempfile = "3.27.0"

