[package]
name = "skills-impl"
description = "Umiejętności (F5): moduł biblioteki — trwały magazyn wersji (JSON, zapis atomowy), zdarzenia skills.* na magistrali, uruchamianie przez agent-runtime z kopertą ≤ roli, dokument .alfa (kategoria skills) przez DocumentStore"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
skills-contract = { path = "../skills-contract" }
agent-runtime-contract = { path = "../agent-runtime-contract" }
tools-common-contract = { path = "../tools-common-contract" }
personas-contract = { path = "../personas-contract" }
transfer-contract = { path = "../transfer-contract" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
async-trait.workspace = true
semver.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
skills-contract = { path = "../skills-contract", features = ["contract-tests"] }
agent-runtime-contract = { path = "../agent-runtime-contract", features = ["contract-tests"] }
agent-runtime-fake = { path = "../agent-runtime-fake" }
core-bus-fake = { path = "../core-bus-fake" }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
