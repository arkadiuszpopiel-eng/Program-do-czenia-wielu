# Manifest modułu ui-terminal (docs/modules/ui-terminal/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
# Bez zdolności Brokera: terminal obsługuje wyłącznie użytkownik (gest UI); agentki nie mają do niego dostępu.
id = "ui-terminal"
version = "0.0.1"
kind = "ui-panel"
provides = ["ui-terminal-contract@1"]
requires = ["platform-contract@1", "core-bus-contract@1"]
capabilities = []
lifecycle = "on-demand"
isolation = "inproc"

[budget]
ram_mb = 4
cpu_pct = 2

[health]
check = "ping"
interval_s = 60
