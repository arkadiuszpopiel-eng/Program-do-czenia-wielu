[package]
name = "ui-terminal-impl"
description = "ui-terminal (F4): menedżer wbudowanych terminali ConPTY nad PseudoConsolePort — wejście tylko z gestu użytkownika, wyjście VT prosto do kanału UI (bez logów, magistrali i pamięci), jawne środowisko bez sekretów, zamknięcie zabija drzewo procesów"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

# Celowo bez `tracing`, `core-log-contract`, `memory-contract`, `tools-*`, `agent-*`, `mcp-*`
# (test `tests/isolation.rs`): strumień terminala logowania nie może trafić do logów ani agentek.
[dependencies]
ui-terminal-contract = { path = "../ui-terminal-contract" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
platform-contract.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
ui-terminal-contract = { path = "../ui-terminal-contract", features = ["contract-tests"] }
platform-fake = { path = "../platform-fake" }
core-bus-fake = { path = "../core-bus-fake" }

[lints]
workspace = true
