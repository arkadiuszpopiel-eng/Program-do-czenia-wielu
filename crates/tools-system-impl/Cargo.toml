[package]
name = "tools-system-impl"
description = "tools-system: narzędzia systemowe agentek przez SysPort i Brokera — procesy (zakończenie gui.control(obraz) ze strażnikiem celów i tożsamością), usługi (system.admin), Dziennik zdarzeń, zmienne środowiskowe (ukryte sekrety, zapis użytkownika z cofaniem), zasilanie/monitory/audio; wynik = treść niezaufana"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
tools-system-contract = { path = "../tools-system-contract" }
