# Manifest narzędzi tools-system (docs/modules/tools-system/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
# Zdolności z tokenów Brokera: odczyty `gui.control(system-info.exe)`, zakończenie procesu
# `gui.control(<obraz>)` (Broker blokuje procesy Jądra), usługi i zapis zmiennej `system.admin`.
id = "tools-system"
version = "0.0.1"
kind = "tool"
provides = ["tools-system-contract@1"]
requires = ["tools-common-contract@1", "platform-apps-contract@1", "safety-broker-contract@1", "platform-contract@1", "core-bus-contract@1"]
capabilities = ["gui.control(system-info.exe)", "gui.control(obraz-procesu)", "system.admin(service_control)", "system.admin(setx)"]
lifecycle = "lazy"
isolation = "inproc"

[budget]
ram_mb = 8
cpu_pct = 5

[health]
check = "ping"
interval_s = 60
