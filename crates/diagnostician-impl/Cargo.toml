[package]
name = "diagnostician-impl"
description = "Diagnosta (F8): usługa — rdzeń z dziennikiem napraw NDJSON (fsync, odzysk przerwanych napraw), zbieranie sygnałów z magistrali (rejestr, watchdog, Diagnostyka, config.invalid), cykliczny skan, adaptery portów naprawy (core-config z porównaj-i-zamień, historia konfiguracji, pliki w dozwolonych korzeniach z kwarantanną i kontrolą SHA-256) i moduł rejestru"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

