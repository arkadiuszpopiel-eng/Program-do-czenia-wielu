# Manifest modułu providers-api (docs/PLAN.md §3.2, docs/modules/providers-api/SPEC.md).
# Schemat: packages/schemas/module-manifest.v1.json
id = "providers-api"
version = "0.0.1"
kind = "provider"
provides = ["providers-contract@1"]
requires = ["core-bus-contract@1"]
# Hosty z katalogu dostawców (egress-allowlista Jądra wyznacza konkretne adresy per konto).
capabilities = ["net.egress(providers-catalog)"]
lifecycle = "lazy"
isolation = "inproc"

[budget]
# SPEC: ≤ 4 MB na aktywny adapter; moduł mieści kilka kont naraz.
ram_mb = 16
cpu_pct = 5

[health]
check = "ping"
interval_s = 60
