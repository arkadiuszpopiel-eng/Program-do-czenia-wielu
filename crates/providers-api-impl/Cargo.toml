[package]
name = "providers-api-impl"
description = "Adaptery ModelProvider dla API chmurowych: Anthropic Messages, OpenAI (Chat Completions, Responses) i generyczne endpointy zgodne z OpenAI/Anthropic"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
providers-contract = { path = "../providers-contract" }
lib-openai-compat = { path = "../lib-openai-compat" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt"] }
tokio-stream.workspace = true
futures-util.workspace = true
# rustls z dostawcą `ring` i certyfikatami systemu (bez OpenSSL, bez aws-lc; ADR/vendor: docs/vendor/reqwest.md).
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "stream", "http2"] }

[dev-dependencies]
providers-contract = { path = "../providers-contract", features = ["contract-tests"] }
providers-fake = { path = "../providers-fake" }
core-bus-fake = { path = "../core-bus-fake" }
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
