# Manifest narzędzi plikowych (docs/modules/tools-fs/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
# Zdolności nie są stałe: każde wywołanie prosi Brokera o token `fs.read/fs.write(zakres)`.
id = "tools-fs"
version = "0.0.1"
kind = "tool"
provides = ["tools-fs-contract@1"]
requires = ["tools-common-contract@1", "safety-broker-contract@1", "undo-journal-contract@1", "platform-contract@1", "core-bus-contract@1"]
capabilities = ["fs.read(zakres-tokenu)", "fs.write(zakres-tokenu)"]
lifecycle = "lazy"
isolation = "inproc"

[budget]
ram_mb = 3
cpu_pct = 5

[health]
check = "ping"
interval_s = 60
