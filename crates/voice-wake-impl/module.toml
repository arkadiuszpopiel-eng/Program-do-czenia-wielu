# Manifest modułu voice-wake v0 (docs/modules/voice-wake/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
id = "voice-wake"
version = "0.0.1"
kind = "voice-engine"
provides = ["voice-wake-contract@1"]
requires = ["core-bus-contract@1", "platform-contract@1", "personas-contract@1", "scheduler-lite-contract@1"]
capabilities = []
lifecycle = "lazy"
isolation = "inproc"

[budget]
# SPEC v0: RAM ≤ 1 MB, reakcja PTT ≤ 10 ms (hook w platform-windows-impl).
ram_mb = 1
cpu_pct = 1

[health]
check = "ping"
interval_s = 60
