# Manifest modułu voice-wake (docs/modules/voice-wake/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
id = "voice-wake"
version = "0.1.0"
kind = "voice-engine"
provides = ["voice-wake-contract@1"]
requires = ["core-bus-contract@1", "platform-contract@1", "personas-contract@1", "scheduler-lite-contract@1", "voice-dsp-contract@1"]
capabilities = []
lifecycle = "lazy"
isolation = "inproc"

[budget]
# SPEC: v0 RAM ≤ 1 MB, reakcja PTT ≤ 10 ms; v1 (słowa wywoławcze, domyślnie wyłączone):
# KWS na CPU ≤ 3% rdzenia baseline (model tylko przy otwartej bramce energii), RAM ≤ 30 MB.
ram_mb = 30
cpu_pct = 3

[health]
check = "ping"
interval_s = 60
