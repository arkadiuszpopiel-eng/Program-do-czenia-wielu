[package]
name = "accounts-hub-impl"
description = "Hub kont i kluczy: katalog dostawców z walidacją JSON Schema, klucze w Windows Credential Manager, kreator, import ze zmiennych środowiskowych, wykrywanie mostów CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
accounts-hub-contract = { path = "../accounts-hub-contract" }
compliance-contract = { path = "../compliance-contract" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true
# Walidacja wpisów katalogu względem providers-catalog/schema.json (MIT); bez pobierania zdalnych
# referencji (default-features = false: bez reqwest/rustls).
jsonschema = { version = "0.58.3", default-features = false }

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager bez `unsafe` w kodzie Alfy (MIT OR Apache-2.0); windows-sys 0.61.2
# jak w reszcie workspace'u.
keyring-core = "1.0.0"
windows-native-keyring-store = "1.1.0"
zeroize = "1.9.0"

[dev-dependencies]
accounts-hub-contract = { path = "../accounts-hub-contract", features = ["contract-tests"] }
accounts-hub-fake = { path = "../accounts-hub-fake" }
compliance-contract = { path = "../compliance-contract", features = ["contract-tests"] }
compliance-fake = { path = "../compliance-fake" }
core-bus-fake = { path = "../core-bus-fake" }
proptest.workspace = true

[lints]
workspace = true
