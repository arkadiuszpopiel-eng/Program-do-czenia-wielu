# Manifest huba kont i kluczy (docs/modules/accounts-hub/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
id = "accounts-hub"
version = "0.0.1"
kind = "service"
provides = ["accounts-hub-contract@1"]
requires = ["core-bus-contract@1", "compliance-contract@1"]
capabilities = ["secrets.read", "secrets.write"]
lifecycle = "lazy"
isolation = "inproc"

[budget]
ram_mb = 3
cpu_pct = 2

[health]
check = "ping"
interval_s = 60
