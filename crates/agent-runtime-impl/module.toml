# Manifest runtime agentek (docs/modules/agent-runtime/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
# Runtime nie żąda zdolności sam — narzędzia proszą Brokera o tokeny przy każdym wywołaniu.
id = "agent-runtime"
version = "0.0.1"
kind = "service"
provides = ["agent-runtime-contract@1"]
requires = ["providers-contract@1", "tools-common-contract@1", "personas-contract@1", "safety-broker-contract@1", "scheduler-contract@1", "core-bus-contract@1"]
capabilities = []
lifecycle = "on-demand"
isolation = "inproc"

[budget]
ram_mb = 10
cpu_pct = 5

[health]
check = "ping"
interval_s = 60
