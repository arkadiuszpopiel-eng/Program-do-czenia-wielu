[package]
name = "voice-tts-impl"
description = "Implementacja voice-tts: sidecary Pocket TTS (JSON-lines po stdio) i Piper, głosy v0 (WSOLA + zmiana wysokości), łańcuch fallback, cache fraz, TTFB"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
voice-tts-contract = { path = "../voice-tts-contract" }
voice-audio-contract = { path = "../voice-audio-contract" }
personas-contract = { path = "../personas-contract" }
providers-contract = { path = "../providers-contract" }
model-residency-contract = { path = "../model-residency-contract" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
sha2 = "0.10.9"
base64 = "0.22.1"

[dev-dependencies]
voice-tts-contract = { path = "../voice-tts-contract", features = ["contract-tests"] }
model-residency-fake = { path = "../model-residency-fake" }
core-bus-fake = { path = "../core-bus-fake" }
tokio = { workspace = true, features = ["io-util", "process"] }
serde_json.workspace = true
base64 = "0.22.1"
core-registry-contract.workspace = true
model-residency-contract = { path = "../model-residency-contract" }
personas-contract = { path = "../personas-contract" }
providers-contract = { path = "../providers-contract" }
voice-audio-contract = { path = "../voice-audio-contract" }

[lints]
workspace = true
