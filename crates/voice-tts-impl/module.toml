# Manifest modułu voice-tts (docs/modules/voice-tts/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
id = "voice-tts"
version = "0.0.1"
kind = "voice-engine"
provides = ["voice-tts-contract@1"]
requires = ["core-bus-contract@1", "voice-audio-contract@1", "personas-contract@1", "model-residency-contract@1"]
# Silniki lokalne (sidecary stdio): bez zdolności sieciowych; chmura (kolejna fala) — net.egress(host).
capabilities = []
lifecycle = "on-demand"
isolation = "process"

[budget]
# SPEC: RAM sidecara 0,5–1,5 GB (Pocket-PL na CPU); tu sam moduł w procesie jądra + cache ≤ 50 MB na dysku.
ram_mb = 64
cpu_pct = 10

[health]
check = "ping"
interval_s = 30
