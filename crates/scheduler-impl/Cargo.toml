[package]
name = "scheduler-impl"
description = "Pełny scheduler (F5): implementacja modułu — zegar tokio, sterownik terminów, wykonawczynie przez port TaskExecutor, zdarzenia scheduler.* na magistrali, stan w pliku (restart = wznowienie), budżet tła z cost-meter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
scheduler-contract = { path = "../scheduler-contract" }
core-bus-contract.workspace = true
core-registry-contract.workspace = true
cost-meter-contract = { path = "../cost-meter-contract" }
async-trait.workspace = true
chrono.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
scheduler-contract = { path = "../scheduler-contract", features = ["contract-tests"] }
core-bus-fake = { path = "../core-bus-fake" }
cost-meter-fake = { path = "../cost-meter-fake" }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
