# Manifest narzędzi tools-dev (docs/modules/tools-dev/SPEC.md). Schemat: packages/schemas/module-manifest.v1.json
# Zdolności z tokenu Brokera: `fs.read(katalog roboczy)` dla dev_git, `shell.exec(katalog roboczy)` dla dev_test.
id = "tools-dev"
version = "0.0.68"
kind = "tool"
provides = ["tools-dev-contract@1"]
requires = ["tools-common-contract@1", "platform-contract@1", "safety-broker-contract@1"]
capabilities = ["fs.read(path)", "shell.exec(path)"]
lifecycle = "lazy"
isolation = "inproc"

[budget]
ram_mb = 8
cpu_pct = 5

[health]
check = "ping"
interval_s = 60
