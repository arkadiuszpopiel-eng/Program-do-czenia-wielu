[package]
name = "tools-dev-impl"
description = "tools-dev: dev_git (odczyt repozytorium przez git w katalogu roboczym, zgoda fs.read) i dev_test (wykrycie projektu, testy w Job Object z limitem czasu i kill-switchem, podsumowanie; zgoda shell.exec)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
tools-dev-contract = { path = "../tools-dev-contract" }
tools-common-contract = { path = "../tools-common-contract" }
tools-shell-contract = { path = "../tools-shell-contract" }
safety-broker-contract = { path = "../safety-broker-contract" }
compliance-contract = { path = "../compliance-contract" }
watchdog-contract = { path = "../watchdog-contract" }
platform-contract.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync"] }

[dev-dependencies]
tools-dev-contract = { path = "../tools-dev-contract", features = ["contract-tests"] }
tools-common-contract = { path = "../tools-common-contract", features = ["contract-tests"] }
safety-broker-fake = { path = "../safety-broker-fake" }
risk-classifier-contract = { path = "../risk-classifier-contract" }
platform-fake = { path = "../platform-fake" }
watchdog-contract = { path = "../watchdog-contract" }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
