<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Dziękujemy — Sklep testowy F6</title>
</head>
<body>
<h1>Dziękujemy za wiadomość</h1>
<p>Otrzymane dane:</p>
<ul id="dane"></ul>
<script>
const lista = document.getElementById('dane');
for (const [klucz, wartosc] of new URLSearchParams(location.search)) {
  const li = document.createElement('li');
  li.textContent = klucz + ': ' + wartosc;
  lista.appendChild(li);
}
</script>
</body>
</html>
